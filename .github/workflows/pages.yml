name: deploy github pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: setup node
        uses: actions/setup-node@1e60f620b9541d2b31cbe8c7a0b92d26f6bd0b5b # v4
        with:
          node-version: 22
          cache: npm

      - name: install and verify
        run: |
          npm ci
          npm run check

      - name: build static site artifact
        run: |
          mkdir -p _site
          rsync -av --delete \
            --exclude ".git" \
            --exclude ".github" \
            --exclude "node_modules" \
            --exclude "tests" \
            --exclude "tools" \
            --exclude "STATUS.md" \
            ./ _site/
          touch _site/.nojekyll

      - name: pin deployed manifest commit
        run: |
          node -e '
            const fs = require("fs");
            const path = "_site/docs/blocks.system.manifest.json";
            const manifest = JSON.parse(fs.readFileSync(path, "utf8"));
            manifest.commit = (process.env.GITHUB_SHA || "unknown").slice(0, 7);
            fs.writeFileSync(path, JSON.stringify(manifest, null, 2) + "\n");
          '

      - name: upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site

      - name: deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
